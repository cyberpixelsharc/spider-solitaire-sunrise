<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PWA Test</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <style>
      body { margin: 0; height: 100dvh; display: grid; place-items: center; text-align: center;
        background: #081712; color: #eaf3ee; font-family: system-ui, sans-serif; }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { margin: 0 0 16px; font-size: 14px; opacity: 0.8; }
      button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #3ecf8e; color: #081712; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <h1 id="title">PWA test page</h1>
      <p>beforeinstallprompt: <strong id="bip">no</strong></p>
      <button id="install" hidden>Install</button>
    </div>
    <script>
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        document.getElementById("bip").textContent = "yes";
        const b = document.getElementById("install");
        b.hidden = false;
        b.addEventListener("click", () => e.prompt());
      });
      window.addEventListener("appinstalled", () => {
        document.getElementById("title").textContent = "installed";
      });
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch((err) => console.error("SW failed:", err));
      }
    </script>
  </body>
</html>
