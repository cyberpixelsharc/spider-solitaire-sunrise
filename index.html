<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spider Solitaire: Sunrise</title>
  <meta name="description" content="Classic Spider Solitaire as a lightweight offline web app." />
  <meta name="theme-color" content="#0b2b22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spider Sunrise" />
  <link rel="manifest" href="manifest.json?v=1.0.13" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="statusbar" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand" id="btn-info" role="button" tabindex="0" data-i18n-title="app.name" title="Spider Solitaire: Sunrise">
      <img src="icons/favicon.svg" class="logo" alt="" width="34" height="34" />
      <h1>Spider Solitaire: Sunrise</h1>
    </div>

    <div class="stats">
      <div class="stat"><span class="label" data-i18n="stats.time">Time</span><span class="value" id="time">00:00</span></div>
      <div class="stat"><span class="label" data-i18n="stats.moves">Moves</span><span class="value" id="moves">0</span></div>
      <div class="stat"><span class="label" data-i18n="stats.score">Score</span><span class="value" id="score">500</span></div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-undo" data-i18n-title="btn.undo.title" title="Undo last move"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.85 5.52A8.2 8.2 0 1 1 3.8 14.07" /><path d="M10.38 2.16 5.5 6.27 11.32 8.89Z" fill="currentColor" stroke="none" /><path d="M8.5 13.64h7" /></svg><span data-i18n="btn.undo">Undo</span></button>
      <button class="btn" id="btn-hint" data-i18n-title="btn.hint.title" title="Show a hint"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6 21.4 12 12 21.4 2.6 12Z" /><path d="M9.8 10.4a2.2 2.2 0 1 1 3.7 1.7c-.7.55-1.3 1-1.3 1.9" /><path d="M12 16.6h.01" /></svg><span data-i18n="btn.hint">Hint</span></button>
      <button class="btn primary" id="btn-leave" data-i18n-title="btn.leave.title" title="End the game"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="3.6" /><path d="M7.8 12h8.2" /><path d="M12.9 8.9 16 12 12.9 15.1" /></svg><span data-i18n="btn.leave">Leave</span></button>
    </div>
  </header>

  <main id="board">
    <div id="slots">
      <div class="slot" id="stock-slot"></div>
    </div>
    <div id="cards"></div>
  </main>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="version.js"></script>
  <script src="script.js"></script>
</body>
</html>
